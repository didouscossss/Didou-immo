name: didou_immo
description: Didou Immo — calculateur de rentabilité immobilière, aide à l'achat.
publish_to: 'none'
version: 1.0.0+38

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter          # sélecteurs de date/heure natifs en français

  # État de l'application
  provider: ^6.1.2

  # Firebase — compte utilisateur, sauvegarde cloud, suggestions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3    # appel de la Cloud Function applyReferralCode
  google_sign_in: ^6.2.1

  # Abonnement via Google Play Billing
  in_app_purchase: ^3.2.0
  # Accès direct aux types Android (GooglePlayProductDetails) — nécessaire
  # pour lire la période de facturation (mensuel/annuel) d'une offre,
  # absente de l'API générique ProductDetails commune aux plateformes.
  in_app_purchase_android: ^0.5.3

  # Recherche de communes (geo.api.gouv.fr)
  http: ^1.2.2

  # UI
  fl_chart: ^0.69.0          # graphiques (projection patrimoniale)
  intl: ^0.20.2              # formatage euros / dates (version imposée par flutter_localizations)
  google_fonts: ^6.2.1       # Fraunces / Inter / Space Mono
  flutter_map: ^7.0.2        # carte de France (onglet Carte)
  latlong2: ^0.9.1           # type LatLng pour flutter_map
  pdf: ^3.11.1                # génération du PDF exporté
  printing: ^5.13.4           # aperçu/partage/impression du PDF (web + Android)
  web: ^1.1.1                 # déclenche le téléchargement des exports CSV (web)

  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8
  firebase_storage: ^12.4.10
  file_picker: ^11.0.3

  # Ouvre un lien externe (Play Store depuis le web, site web depuis l'app
  # Android) — fonctionne nativement sur toutes les plateformes, contrairement
  # à package:web qui ne compile que pour le web (voir lib/services/web_nav/).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#050C1A"
    theme_color: "#050C1A"
